<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>︵‿୨♡୧‿︵</title>
  <style>
    /* 引入可愛中文字體 (Zen Maru Gothic) 與日系古典英文字體 (Cormorant Garamond) */
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,600&family=Zen+Maru+Gothic:wght@400;500;700&display=swap');

    * {
      box-sizing: border-box;
    }

    body {
      background-color: #FFFDF9;
      background-image: 
        radial-gradient(#FCE1E4 1.8px, transparent 1.8px), 
        radial-gradient(#FCE1E4 1.8px, #FFFDF9 1.8px);
      background-size: 24px 24px;
      background-position: 0 0, 12px 12px;
      color: #5C4A4A;
      font-family: 'Zen Maru Gothic', sans-serif;
      margin: 0;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .en-font {
      font-family: 'Cormorant Garamond', serif !important;
    }

    /* ===== Fullscreen Loading Screen ===== */
    #loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #FFFDF9;
      background-image: 
        radial-gradient(#FCE1E4 1.8px, transparent 1.8px), 
        radial-gradient(#FCE1E4 1.8px, #FFFDF9 1.8px);
      background-size: 24px 24px;
      background-position: 0 0, 12px 12px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 15px;
      transition: opacity 0.6s ease, visibility 0.6s ease;
    }

    .loading-img {
      width: 80px;
      height: auto;
      animation: float 2.5s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }

    .loading-text {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.4rem;
      font-weight: 600;
      color: #D87074;
      letter-spacing: 2px;
    }

    /* 點點冒出動畫 */
    .dot1, .dot2, .dot3 {
      opacity: 0;
      animation: dotFade 1.5s infinite;
    }

    .dot2 { animation-delay: 0.3s; }
    .dot3 { animation-delay: 0.6s; }

    @keyframes dotFade {
      0%, 100% { opacity: 0; }
      50% { opacity: 1; }
    }

    /* ===== 主容器 ===== */
    .main-container {
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      transition: all 0.3s ease;
    }

    .left-column {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      width: 100%;
    }

    /* ===== 大頭貼 ===== */
    .avatar-section {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .circle-avatar-container {
      width: 90px;
      height: 90px;
      flex-shrink: 0;
    }

    .circle-frame {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 4px solid #FCE1E4;
      background-color: #FFFFFF;
      overflow: hidden;
      box-shadow: 0px 4px 12px rgba(92, 74, 74, 0.08);
    }

    .circle-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* ===== Contents 目錄條 ===== */
    .menu-card {
      background: #FFFFFF;
      border: 2px solid #FCE1E4;
      border-radius: 16px;
      padding: 12px 20px;
      box-shadow: 0px 4px 12px rgba(226, 149, 152, 0.12);
      width: fit-content;
      min-width: 170px;
      text-align: left;
    }

    .menu-header {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.6rem;
      color: #E29598;
      font-weight: 700;
      cursor: pointer;
      user-select: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .menu-icon {
      width: 24px;
      height: 24px;
      object-fit: contain;
    }

    /* 選單列表（預設手機隱藏） */
    .menu-links {
      display: none;
      flex-direction: column;
      gap: 12px;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px dashed #FCE1E4;
    }

    .menu-links.show {
      display: flex;
    }

    /* 主要項目 (About / Dream) */
    .menu-item-group {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .menu-main-title {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      color: #5C4A4A;
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.35rem;
      font-weight: 700;
      transition: color 0.2s;
    }

    .menu-main-title:hover {
      color: #D87074;
    }

    .title-gif {
      width: 18px;
      height: 18px;
      object-fit: contain;
    }

    /* 子選項群組 (縮排至第一個字母後方) */
    .menu-sub-links {
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding-left: 24px; /* 子選項向右微縮排 */
      margin-top: 4px;
    }

    .menu-sub-btn {
      text-decoration: none;
      color: #8C7576;
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.05rem;
      font-weight: 500;
      transition: color 0.2s;
    }

    .menu-sub-btn:hover {
      color: #D87074;
    }

    /* ===== 社群按鈕 ===== */
    .social-links {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 24px;
      margin-top: 4px;
    }

    .social-icon {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      object-fit: cover;
      box-shadow: 0px 2px 6px rgba(226, 149, 152, 0.15);
      transition: transform 0.2s;
    }

    .social-icon:hover {
      transform: scale(1.1);
    }

    /* ===== 歡迎語卡片 ===== */
    .ribbon-card {
      position: relative;
      background: #FFFFFF;
      border: 2px solid #FCE1E4;
      border-radius: 20px;
      padding: 30px 20px 25px 20px;
      width: 100%;
      box-shadow: 0px 6px 18px rgba(226, 149, 152, 0.12);
      box-sizing: border-box;
      text-align: center;
    }

    .card-icon {
      position: absolute;
      top: -22px;
      left: 50%;
      transform: translateX(-50%);
      background-color: transparent;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .card-icon img {
      max-width: 65px;
      max-height: 45px;
      height: auto;
    }

    .notice-text {
      font-size: 0.95rem;
      line-height: 1.8;
      color: #5C4A4A;
      font-weight: 500;
    }

    .notice-highlight {
      color: #D87074;
      font-weight: 700;
    }

    /* 淺粉色分隔線 */
    .pink-divider {
      border: none;
      border-top: 1px dashed #FCE1E4;
      margin: 18px 0;
      width: 100%;
    }

    /* ===== 紀念日區塊 ===== */
    .anniversary-card {
      position: relative;
      padding: 15px 10px 5px 10px;
      background: radial-gradient(ellipse at center, rgba(252, 225, 228, 0.6) 0%, rgba(255, 255, 255, 0) 70%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .anniversary-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.35rem;
      font-weight: 700;
      color: #A38789;
      letter-spacing: 2px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .star-icon {
      color: #D87074;
      font-size: 0.8rem;
    }

    .since-text {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.3rem;
      font-weight: 600;
      color: #8C7576;
      letter-spacing: 1px;
    }

    .days-text {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2.3rem;
      color: #704E50;
      font-weight: 700;
      margin: 2px 0 4px 0;
      letter-spacing: 1px;
    }

    .days-text span.unit {
      font-size: 1.15rem;
      color: #9C8384;
      font-weight: 500;
      margin-left: 6px;
    }

    .today-date-text {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.2rem;
      font-weight: 600;
      color: #A38789;
      letter-spacing: 1px;
    }

    /* ===== 感謝區塊 (Thanks) ===== */
    .thanks-section {
      padding-top: 4px;
      font-family: 'Zen Maru Gothic', sans-serif;
    }

    .thanks-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: #D87074;
      margin-bottom: 2px;
    }

    .thanks-names {
      font-size: 0.88rem;
      color: #8C7576;
      font-weight: 500;
    }

    /* ===== 音樂播放按鈕（移至卡片右側框線上，對齊指定文字高度） ===== */
    .music-btn {
      position: absolute;
      right: -21px; /* 剛好跨放在右邊框線上 */
      top: 142px;    /* 高度對齊「不會催稿...」該行內文附近 */
      width: 42px;
      height: 42px;
      background-color: #FFFFFF;
      border: 2px solid #FCE1E4;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      box-shadow: 0px 3px 8px rgba(226, 149, 152, 0.2);
      overflow: hidden;
      padding: 4px;
      transition: transform 0.2s, background-color 0.2s;
      user-select: none;
      z-index: 10;
    }

    .music-btn img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .music-btn:hover {
      transform: scale(1.1);
      background-color: #FFFDF9;
    }

    .music-btn.playing {
      animation: spin 3s linear infinite;
      border-color: #E29598;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    /* ===== 平板與電腦版響應式設計 ===== */
    @media (min-width: 680px) {
      .main-container {
        max-width: 720px;
        flex-direction: row;
        align-items: flex-start;
        gap: 30px;
      }

      .left-column {
        width: 220px;
        flex-shrink: 0;
      }

      .menu-card {
        width: 100%;
      }

      /* 平板/電腦版：目錄選單強制直接展開 */
      .menu-links {
        display: flex !important;
      }

      .ribbon-card {
        flex: 1;
      }
    }
  </style>
</head>
<body>

  <!-- Loading 載入畫面 -->
  <div id="loading-screen">
    <img src="1785953107867-removebg-preview.png" alt="Loading Icon" class="loading-img">
    <div class="loading-text">
      Loading<span class="dot1">.</span><span class="dot2">.</span><span class="dot3">.</span>
    </div>
  </div>

  <div class="main-container">

    <!-- 左欄區塊 -->
    <div class="left-column">
      <div class="avatar-section">
        <div class="circle-avatar-container">
          <div class="circle-frame">
            <img class="circle-img" src="IMG_3979.PNG" alt="大頭照">
          </div>
        </div>
      </div>

      <!-- Contents 目錄 -->
      <div class="menu-card">
        <div class="menu-header" onclick="toggleMenu()">
          <img src="IMG_3836.GIF" alt="icon" class="menu-icon">
          <span>Contents</span>
        </div>
        
        <div class="menu-links" id="menuLinks">
          <!-- About 主項目 + 子選項 -->
          <div class="menu-item-group">
            <a href="about.html" class="menu-main-title">
              <img src="IMG_4904.GIF" alt="icon" class="title-gif">
              <span>About</span>
            </a>
            <div class="menu-sub-links">
              <a href="about.html#character" class="menu-sub-btn">Character</a>
              <a href="about.html#propic" class="menu-sub-btn">Pro pic</a>
              <a href="about.html#height" class="menu-sub-btn">Height</a>
            </div>
          </div>

          <!-- Dream 主項目 + 子選項 -->
          <div class="menu-item-group">
            <a href="dream.html" class="menu-main-title">
              <img src="IMG_4905.GIF" alt="icon" class="title-gif">
              <span>Dream</span>
            </a>
            <div class="menu-sub-links">
              <a href="dream.html#painting" class="menu-sub-btn">Painting</a>
              <a href="dream.html#article" class="menu-sub-btn">Article</a>
              <a href="dream.html#song" class="menu-sub-btn">Song</a>
              <a href="dream.html#memo" class="menu-sub-btn">Memo</a>
            </div>
          </div>
        </div>
      </div>

      <!-- 社群連結按鈕 -->
      <div class="social-links">
        <a href="https://www.facebook.com/share/1DKCVjFYUC/?mibextid=wwXIfr" target="_blank" title="Facebook">
          <img src="1785949250711.jpg" alt="FB" class="social-icon">
        </a>
        <a href="https://www.plurk.com/u/sisi_0311" target="_blank" title="Plurk">
          <img src="1785949250411.jpg" alt="Plurk" class="social-icon">
        </a>
      </div>
    </div>

    <!-- 右欄區塊：歡迎語 + 紀念日 + 感謝 -->
    <div class="ribbon-card">
      <div class="card-icon">
        <img src="IMG_4880.GIF" alt="GIF Icon">
      </div>
      
      <div class="notice-text">
        <p class="notice-highlight" style="font-size: 1.1rem; margin-top: 5px; margin-bottom: 4px;">
          戀與製作人 ｜ 凌肖夢向
        </p>
        <p style="margin: 0 0 16px 0; color: #A08888; font-size: 0.9rem;">
          存放有關夢的一切。
        </p>

        <p style="margin: 6px 0;">若無法承接中國乙遊/凌肖夢向皆可直接退設。</p>
        <p style="margin: 6px 0;">不會催稿，但如果有延期需求希望主動告知。</p>
        <p style="margin: 6px 0;">趕時間的話建議可以看 <span class="en-font" style="font-weight: 700; color: #D87074; font-size: 1.15rem;">About</span>。</p>
        <p style="margin: 6px 0; font-size: 0.88rem; color: #A08888;">
          建議使用電腦版網頁或平板開啟。
        </p>

        <!-- 第一條分隔線 -->
        <hr class="pink-divider">

        <!-- 紀念日區塊 -->
        <div class="anniversary-card">
          <div class="anniversary-title">
            <span class="star-icon">✦</span>
            <span>Subplot</span>
            <span class="star-icon">✦</span>
          </div>

          <div class="since-text">
            since 2019. 04. 27
          </div>

          <div class="days-text">
            <span id="daysCountNum">----</span><span class="unit">days</span>
          </div>

          <div class="today-date-text" id="todayDate">
            ----. --. --
          </div>
        </div>

        <!-- 第二條分隔線 -->
        <hr class="pink-divider">

        <!-- 感謝區塊 -->
        <div class="thanks-section">
          <div class="thanks-title">Thanks</div>
          <div class="thanks-names">ㄅㄅ、噗轉、嘎、NN</div>
        </div>

      </div>

      <!-- 右側框線上音樂播放按鈕 -->
      <div class="music-btn" id="musicBtn" onclick="toggleMusic()" title="播放音樂">
        <img src="1785943711222-removebg-preview.png" alt="Music Icon">
      </div>
      <audio id="bgm" src="bgm.mp3" loop></audio>
    </div>

  </div>

  <script>
    // 網頁完全載入後隱藏 Loading 畫面
    window.addEventListener('load', function() {
      const loader = document.getElementById('loading-screen');
      setTimeout(() => {
        loader.style.opacity = '0';
        loader.style.visibility = 'hidden';
      }, 500); // 稍微停頓半秒確保流暢
    });

    // 控制手機版目錄展開/收合
    function toggleMenu() {
      const menuLinks = document.getElementById('menuLinks');
      menuLinks.classList.toggle('show');
    }

    // 控制背景音樂播放/暫停
    function toggleMusic() {
      const audio = document.getElementById('bgm');
      const btn = document.getElementById('musicBtn');
      
      if (audio.paused) {
        audio.play().then(() => {
          btn.classList.add('playing');
        }).catch(err => {
          alert('請先上傳背景音樂檔（bgm.mp3）或確認網址正確喔！');
        });
      } else {
        audio.pause();
        btn.classList.remove('playing');
      }
    }

    // 計算天數與今日日期
    function updateAnniversary() {
      const startDate = new Date('2019-04-27T00:00:00');
      const today = new Date();

      const diffTime = Math.abs(today - startDate);
      const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
      
      document.getElementById('daysCountNum').innerText = diffDays.toLocaleString();

      const year = today.getFullYear();
      const month = String(today.getMonth() + 1).padStart(2, '0');
      const date = String(today.getDate()).padStart(2, '0');

      document.getElementById('todayDate').innerText = `${year}. ${month}. ${date}`;
    }

    updateAnniversary();
  </script>

</body>
</html>
