<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>︵‿୨♡୧‿︵</title>
  <style>
    /* 引入可愛中文字體 (Zen Maru Gothic)、 Gamja Flower 與日系襯線字體 (Cormorant Garamond) */
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Gamja+Flower&family=Zen+Maru+Gothic:wght@400;500;700&display=swap');

    * {
      box-sizing: border-box;
    }

    body {
      background-color: #FFFDF9;
      background-image: 
        radial-gradient(#FCE1E4 1.8px, transparent 1.8px), 
        radial-gradient(#FCE1E4 1.8px, #FFFDF9 1.8px);
      background-size: 24px 24px;
      background-position: 0 0, 12px 12px;
      color: #5C4A4A;
      font-family: 'Zen Maru Gothic', sans-serif;
      margin: 0;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .en-font {
      font-family: 'Gamja Flower', cursive !important;
    }

    .main-container {
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      transition: all 0.3s ease;
    }

    .left-column {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      width: 100%;
    }

    /* ===== 大頭貼 ===== */
    .avatar-section {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .circle-avatar-container {
      width: 90px;
      height: 90px;
      flex-shrink: 0;
    }

    .circle-frame {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 4px solid #FCE1E4;
      background-color: #FFFFFF;
      overflow: hidden;
      box-shadow: 0px 4px 12px rgba(92, 74, 74, 0.08);
    }

    .circle-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* ===== Contents 目錄條 ===== */
    .menu-card {
      background: #FFFFFF;
      border: 2px solid #FCE1E4;
      border-radius: 16px;
      padding: 10px 20px;
      box-shadow: 0px 4px 12px rgba(226, 149, 152, 0.12);
      width: fit-content;
      min-width: 150px;
      text-align: center;
    }

    .menu-header {
      font-family: 'Gamja Flower', cursive;
      font-size: 1.5rem;
      color: #E29598;
      font-weight: 700;
      cursor: pointer;
      user-select: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .menu-icon {
      width: 24px;
      height: 24px;
      object-fit: contain;
    }

    .menu-links {
      display: none;
      flex-direction: column;
      gap: 8px;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px dashed #FCE1E4;
    }

    .menu-links.show {
      display: flex;
    }

    .menu-btn {
      text-decoration: none;
      color: #5C4A4A;
      font-family: 'Gamja Flower', cursive;
      font-size: 1.25rem;
      font-weight: 600;
      background: #FFFDF9;
      border: 1px solid #FCE1E4;
      padding: 6px 12px;
      border-radius: 10px;
      text-align: center;
      transition: all 0.2s;
    }

    .menu-btn:hover {
      background: #FCE1E4;
      color: #D87074;
    }

    /* ===== 社群按鈕（增加中間間距） ===== */
    .social-links {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 24px; /* 間距加大，不再太擠 */
      margin-top: 4px;
    }

    .social-icon {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      object-fit: cover;
      box-shadow: 0px 2px 6px rgba(226, 149, 152, 0.15);
      transition: transform 0.2s;
    }

    .social-icon:hover {
      transform: scale(1.1);
    }

    /* ===== 歡迎語卡片 ===== */
    .ribbon-card {
      position: relative;
      background: #FFFFFF;
      border: 2px solid #FCE1E4;
      border-radius: 20px;
      padding: 30px 20px 25px 20px;
      width: 100%;
      box-shadow: 0px 6px 18px rgba(226, 149, 152, 0.12);
      box-sizing: border-box;
      text-align: center;
    }

    .card-icon {
      position: absolute;
      top: -22px;
      left: 50%;
      transform: translateX(-50%);
      background-color: transparent;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .card-icon img {
      max-width: 65px;
      max-height: 45px;
      height: auto;
    }

    .notice-text {
      font-size: 0.95rem;
      line-height: 1.8;
      color: #5C4A4A;
      font-weight: 500;
    }

    .notice-highlight {
      color: #D87074;
      font-weight: 700;
    }

    /* 淺粉色分隔線 */
    .pink-divider {
      border: none;
      border-top: 1px dashed #FCE1E4;
      margin: 18px 0;
      width: 100%;
    }

    /* ===== 柔和無邊界漸層紀念日區塊 ===== */
    .anniversary-card {
      position: relative;
      padding: 20px 10px 10px 10px;
      /* 完美無邊界漸層：由中心的柔粉漸變融合至純白色 */
      background: radial-gradient(ellipse at center, rgba(252, 225, 228, 0.6) 0%, rgba(255, 255, 255, 0) 70%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    /* 第一行：Subplot + 深粉色星星 */
    .anniversary-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.25rem;
      color: #A38789;
      letter-spacing: 2px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .star-icon {
      color: #D87074; /* 深粉色閃光 */
      font-size: 0.8rem;
    }

    /* 第二行：since 2019. 04. 27 */
    .since-text {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.25rem;
      color: #8C7576;
      letter-spacing: 1px;
    }

    /* 第三行：天數（刪除 D+，只保留數字與 days） */
    .days-text {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2.2rem;
      color: #704E50;
      font-weight: 600;
      margin: 4px 0 6px 0;
      letter-spacing: 1px;
    }

    .days-text span.unit {
      font-size: 1.15rem;
      color: #9C8384;
      font-weight: 400;
      margin-left: 6px;
    }

    /* 第四行：今日日期（無膠囊，保持古典 serif 字體設計） */
    .today-date-text {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.15rem;
      color: #A38789;
      letter-spacing: 1px;
    }

    /* 音樂按鈕 */
    .music-btn {
      position: absolute;
      bottom: -15px;
      left: 15px;
      width: 42px;
      height: 42px;
      background-color: #FFFFFF;
      border: 2px solid #FCE1E4;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      box-shadow: 0px 3px 8px rgba(226, 149, 152, 0.2);
      overflow: hidden;
      padding: 4px;
      transition: transform 0.2s, background-color 0.2s;
      user-select: none;
    }

    .music-btn img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .music-btn:hover {
      transform: scale(1.1);
      background-color: #FFFDF9;
    }

    .music-btn.playing {
      animation: spin 3s linear infinite;
      border-color: #E29598;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    /* 響應式設定 */
    @media (min-width: 680px) {
      .main-container {
        max-width: 720px;
        flex-direction: row;
        align-items: flex-start;
        gap: 30px;
      }

      .left-column {
        width: 220px;
        flex-shrink: 0;
      }

      .menu-card {
        width: 100%;
      }

      .ribbon-card {
        flex: 1;
      }
    }
  </style>
</head>
<body>

  <div class="main-container">

    <!-- 左欄區塊 -->
    <div class="left-column">
      <div class="avatar-section">
        <div class="circle-avatar-container">
          <div class="circle-frame">
            <img class="circle-img" src="IMG_3979.PNG" alt="大頭照">
          </div>
        </div>
      </div>

      <div class="menu-card">
        <div class="menu-header" onclick="toggleMenu()">
          <img src="IMG_3836.GIF" alt="icon" class="menu-icon">
          <span>Contents</span>
        </div>
        <div class="menu-links" id="menuLinks">
          <a href="about.html" class="menu-btn">About</a>
          <a href="dream.html" class="menu-btn">Dream</a>
          <a href="memo.html" class="menu-btn">Memo</a>
        </div>
      </div>

      <div class="social-links">
        <a href="https://www.facebook.com/share/1DKCVjFYUC/?mibextid=wwXIfr" target="_blank" title="Facebook">
          <img src="1785949250711.jpg" alt="FB" class="social-icon">
        </a>
        <a href="https://www.plurk.com/u/sisi_0311" target="_blank" title="Plurk">
          <img src="1785949250411.jpg" alt="Plurk" class="social-icon">
        </a>
      </div>
    </div>

    <!-- 右欄區塊：歡迎語 + 柔和紀念日 -->
    <div class="ribbon-card">
      <div class="card-icon">
        <img src="IMG_4880.GIF" alt="GIF Icon">
      </div>
      
      <div class="notice-text">
        <p class="notice-highlight" style="font-size: 1.1rem; margin-top: 5px; margin-bottom: 4px;">
          戀與製作人 ｜ 凌肖夢向
        </p>
        <p style="margin: 0 0 16px 0; color: #A08888; font-size: 0.9rem;">
          存放有關夢的一切。
        </p>

        <p style="margin: 6px 0;">若無法承接中國乙遊/凌肖夢向皆可直接退設。</p>
        <p style="margin: 6px 0;">不會催稿，但如果有延期需求希望主動告知。</p>
        <p style="margin: 6px 0;">趕時間的話建議可以看 <span class="en-font" style="font-weight: 700; color: #D87074; font-size: 1.1rem;">About</span>。</p>
        <p style="margin: 6px 0; font-size: 0.88rem; color: #A08888;">
          建議使用電腦版網頁或平板開啟。
        </p>

        <hr class="pink-divider">

        <!-- 紀念日區塊 -->
        <div class="anniversary-card">
          <div class="anniversary-title">
            <span class="star-icon">✦</span>
            <span>Subplot</span>
            <span class="star-icon">✦</span>
          </div>

          <div class="since-text">
            since 2019. 04. 27
          </div>

          <div class="days-text">
            <span id="daysCountNum">----</span><span class="unit">days</span>
          </div>

          <!-- 今日日期 -->
          <div class="today-date-text" id="todayDate">
            ----. --. --
          </div>
        </div>

      </div>

      <!-- 音樂播放按鈕 -->
      <div class="music-btn" id="musicBtn" onclick="toggleMusic()" title="播放音樂">
        <img src="1785943711222-removebg-preview.png" alt="Music Icon">
      </div>
      <audio id="bgm" src="bgm.mp3" loop></audio>
    </div>

  </div>

  <script>
    function toggleMenu() {
      const menuLinks = document.getElementById('menuLinks');
      menuLinks.classList.toggle('show');
    }

    function toggleMusic() {
      const audio = document.getElementById('bgm');
      const btn = document.getElementById('musicBtn');
      
      if (audio.paused) {
        audio.play().then(() => {
          btn.classList.add('playing');
        }).catch(err => {
          alert('請先上傳背景音樂檔（bgm.mp3）或確認網址正確喔！');
        });
      } else {
        audio.pause();
        btn.classList.remove('playing');
      }
    }

    // 計算天數與今日日期
    function updateAnniversary() {
      const startDate = new Date('2019-04-27T00:00:00');
      const today = new Date();

      // 計算天數差（不含起始日當天，符合手機紀念日 App 天數）
      const diffTime = Math.abs(today - startDate);
      const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
      
      // 數字加上千分位逗號（例如：2,658）
      document.getElementById('daysCountNum').innerText = diffDays.toLocaleString();

      // 格式化今日日期 (YYYY. MM. DD)
      const year = today.getFullYear();
      const month = String(today.getMonth() + 1).padStart(2, '0');
      const date = String(today.getDate()).padStart(2, '0');

      document.getElementById('todayDate').innerText = `${year}. ${month}. ${date}`;
    }

    updateAnniversary();
  </script>

</body>
</html>
