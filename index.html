<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ling Xiao & Me 🌸</title>
  <style>
    /* 引入圓潤手寫感中文字體與英文手寫體 */
    @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Zen+Maru+Gothic:wght@400;500;700&display=swap');

    body {
      background-color: #FFFDF9; /* 溫暖奶油白底色 */
      color: #5C4A4A; /* 溫柔深棕色文字 */
      font-family: 'Zen Maru Gothic', sans-serif;
      margin: 0;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* 手寫風大標題 */
    h1 {
      font-family: 'Caveat', cursive;
      font-size: 3.2rem;
      color: #E29598; /* 奶油莫蘭迪粉 */
      margin-bottom: 30px;
      text-shadow: 2px 2px 0px #FCE1E4;
      text-align: center;
    }

    /* 復古手繪風格：橢圓大頭照 + 緞帶蝴蝶結裝飾框 */
    .ribbon-avatar-container {
      position: relative;
      width: 210px;
      height: 260px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 35px;
    }

    /* 頂部手繪感雙層蝴蝶結裝飾 */
    .ribbon-bow {
      position: absolute;
      top: -18px;
      z-index: 10;
      font-size: 2.2rem;
      filter: drop-shadow(0px 2px 3px rgba(226, 149, 152, 0.3));
    }

    /* 橢圓照片內框 */
    .oval-frame {
      width: 190px;
      height: 240px;
      border-radius: 50% / 50%;
      border: 6px solid #FCE1E4;
      outline: 2px dashed #E29598;
      outline-offset: 4px;
      background-color: #FFFFFF;
      overflow: hidden;
      box-shadow: 0px 8px 20px rgba(92, 74, 74, 0.08);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .oval-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* 緞帶蝴蝶結風格卡片 */
    .ribbon-card {
      position: relative;
      background: #FFFFFF;
      border: 2px solid #FCE1E4;
      border-radius: 20px;
      padding: 30px 25px 25px 25px;
      max-width: 460px;
      width: 100%;
      box-shadow: 0px 6px 18px rgba(226, 149, 152, 0.12);
      margin-bottom: 25px;
      box-sizing: border-box;
      text-align: center;
    }

    /* 卡片頂部的小蝴蝶結 */
    .card-bow {
      position: absolute;
      top: -16px;
      left: 50%;
      transform: translateX(-50%);
      background-color: #FFFDF9;
      padding: 0 10px;
      font-size: 1.5rem;
    }

    .notice-text {
      font-size: 0.98rem;
      line-height: 1.8;
      color: #5C4A4A;
      font-weight: 500;
    }

    .notice-highlight {
      color: #D87074;
      font-weight: 700;
    }
  </style>
</head>
<body>

  <h1>Welcome to Our Cozy Home ✨</h1>

  <!-- 復古手繪風橢圓大頭照（已帶入你的圖片檔名） -->
  <div class="ribbon-avatar-container">
    <div class="ribbon-bow">🎀</div>
    <div class="oval-frame">
      <img class="oval-img" src="IMG_3979.PNG" alt="大頭照">
    </div>
  </div>

  <!-- 緞帶蝴蝶結歡迎語與須知卡片 -->
  <div class="ribbon-card">
    <div class="card-bow">🎀</div>
    <div class="notice-text">
      <p class="notice-highlight" style="font-size: 1.1rem; margin-top: 5px; margin-bottom: 12px;">
        戀與製作人 ｜ 凌肖夢向
      </p>
      <p style="margin: 8px 0;">若無法承接中國乙遊/凌肖夢向皆可直接退幣/退設。</p>
      <p style="margin: 8px 0;">不會催稿，但如果老師有延期需求希望主動告知。</p>
      <p style="margin: 8px 0;">趕時間的話建議直接看 About。</p>
      <p style="margin: 12px 0 0 0; font-size: 0.88rem; color: #A08888;">
        💡 建議使用電腦版網頁或平板開啟。
      </p>
    </div>
  </div>

</body>
</html>
