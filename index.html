<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ling Xiao & Me 🌸</title>
  <style>
    /* 引入圓潤可愛中文字體 (Zen Maru Gothic) 與塗鴉手寫感英文字體 (Shantell Sans) */
    @import url('https://fonts.googleapis.com/css2?family=Shantell+Sans:ital,wght@0,500;0,700;1,600&family=Zen+Maru+Gothic:wght@400;500;700&display=swap');

    * {
      box-sizing: border-box;
    }

    body {
      /* 溫暖奶油白底色 + 柔和粉紅可愛波點背景 */
      background-color: #FFFDF9;
      background-image: radial-gradient(#FCE1E4 1.5px, transparent 1.5px);
      background-size: 20px 20px; /* 波點間距 */
      color: #5C4A4A;
      font-family: 'Zen Maru Gothic', sans-serif;
      margin: 0;
      padding: 30px 15px;
      display: flex;
      flex-direction: column;
      align-items: center;      /* 水平居中 */
      justify-content: center; /* 畫面垂直居中 */
      min-height: 100vh;
    }

    /* 主容器 */
    .main-container {
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    /* ===== 第一層：獨立圓形大頭貼 ===== */
    .avatar-section {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .circle-avatar-container {
      width: 90px;
      height: 90px;
      flex-shrink: 0;
    }

    .circle-frame {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 4px solid #FCE1E4;
      background-color: #FFFFFF;
      overflow: hidden;
      box-shadow: 0px 4px 12px rgba(92, 74, 74, 0.08);
    }

    .circle-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* ===== 第二層：精緻短版 Contents 目錄條 ===== */
    .menu-card {
      background: #FFFFFF;
      border: 2px solid #FCE1E4;
      border-radius: 16px;
      padding: 10px 24px;
      box-shadow: 0px 4px 12px rgba(226, 149, 152, 0.12);
      width: fit-content; /* **縮短至剛好符合文字寬度** */
      min-width: 140px;   /* 設定最小寬度保持比例好看 */
      text-align: center;
    }

    .menu-header {
      font-family: 'Shantell Sans', cursive;
      font-size: 1.3rem;
      color: #E29598;
      font-weight: 700;
      cursor: pointer;
      user-select: none;
      letter-spacing: 0.5px;
    }

    /* 選單展開按鈕區 */
    .menu-links {
      display: none;
      flex-direction: column;
      gap: 8px;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px dashed #FCE1E4;
    }

    .menu-links.show {
      display: flex;
    }

    .menu-btn {
      text-decoration: none;
      color: #5C4A4A;
      font-family: 'Shantell Sans', cursive;
      font-size: 1.05rem;
      font-weight: 600;
      background: #FFFDF9;
      border: 1px solid #FCE1E4;
      padding: 6px 12px;
      border-radius: 10px;
      text-align: center;
      transition: all 0.2s;
    }

    .menu-btn:hover {
      background: #FCE1E4;
      color: #D87074;
    }

    /* ===== 第三層：歡迎語卡片 ===== */
    .ribbon-card {
      position: relative;
      background: #FFFFFF;
      border: 2px solid #FCE1E4;
      border-radius: 20px;
      padding: 30px 20px 25px 20px;
      width: 100%;
      box-shadow: 0px 6px 18px rgba(226, 149, 152, 0.12);
      box-sizing: border-box;
      text-align: center;
    }

    /* GIF 圖標（已修復透明背景問題） */
    .card-icon {
      position: absolute;
      top: -22px;
      left: 50%;
      transform: translateX(-50%);
      background-color: transparent; /* **改為透明背景** */
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .card-icon img {
      max-width: 65px;
      max-height: 45px;
      height: auto;
    }

    .notice-text {
      font-size: 0.95rem;
      line-height: 1.8;
      color: #5C4A4A;
      font-weight: 500;
    }

    .notice-highlight {
      color: #D87074;
      font-weight: 700;
    }

    /* ===== 左下角音樂播放按鈕 ===== */
    .music-btn {
      position: absolute;
      bottom: -15px;
      left: 15px;
      width: 42px;
      height: 42px;
      background-color: #FFFFFF;
      border: 2px solid #FCE1E4;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      box-shadow: 0px 3px 8px rgba(226, 149, 152, 0.2);
      overflow: hidden;
      padding: 4px;
      transition: transform 0.2s, background-color 0.2s;
      user-select: none;
    }

    .music-btn img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .music-btn:hover {
      transform: scale(1.1);
      background-color: #FFFDF9;
    }

    .music-btn.playing {
      animation: spin 3s linear infinite;
      border-color: #E29598;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="main-container">

    <!-- 第一層：獨立大頭貼 -->
    <div class="avatar-section">
      <div class="circle-avatar-container">
        <div class="circle-frame">
          <img class="circle-img" src="IMG_3979.PNG" alt="大頭照">
        </div>
      </div>
    </div>

    <!-- 第二層：精緻短版 Contents 選單條 -->
    <div class="menu-card">
      <div class="menu-header" onclick="toggleMenu()">
        Contents
      </div>
      <div class="menu-links" id="menuLinks">
        <a href="about.html" class="menu-btn">About</a>
        <a href="dream.html" class="menu-btn">Dream</a>
        <a href="memo.html" class="menu-btn">Memo</a>
      </div>
    </div>

    <!-- 第三層：歡迎語卡片 -->
    <div class="ribbon-card">
      <div class="card-icon">
        <img src="IMG_4880.GIF" alt="GIF Icon">
      </div>
      
      <div class="notice-text">
        <p class="notice-highlight" style="font-size: 1.1rem; margin-top: 5px; margin-bottom: 12px;">
          戀與製作人 ｜ 凌肖夢向
        </p>
        <p style="margin: 8px 0;">若無法承接中國乙遊/凌肖夢向皆可直接退幣/退設。</p>
        <p style="margin: 8px 0;">不會催稿，但如果老師有延期需求希望主動告知。</p>
        <p style="margin: 8px 0;">趕時間的話建議直接看 <span style="font-family: 'Shantell Sans', cursive; font-weight: 700; color: #D87074;">About</span>。</p>
        <p style="margin: 12px 0 0 0; font-size: 0.85rem; color: #A08888;">
          💡 建議使用電腦版網頁或平板開啟。
        </p>
      </div>

      <!-- 左下角音樂播放按鈕 -->
      <div class="music-btn" id="musicBtn" onclick="toggleMusic()" title="播放音樂">
        <img src="1785943711222-removebg-preview.png" alt="Music Icon">
      </div>
      <audio id="bgm" src="bgm.mp3" loop></audio>
    </div>

  </div> <!-- 結束 main-container -->

  <script>
    // 控制目錄展開與收合
    function toggleMenu() {
      const menuLinks = document.getElementById('menuLinks');
      menuLinks.classList.toggle('show');
    }

    // 控制背景音樂播放與暫停
    function toggleMusic() {
      const audio = document.getElementById('bgm');
      const btn = document.getElementById('musicBtn');
      
      if (audio.paused) {
        audio.play().then(() => {
          btn.classList.add('playing');
        }).catch(err => {
          alert('請先上傳背景音樂檔（bgm.mp3）或確認網址正確喔！');
        });
      } else {
        audio.pause();
        btn.classList.remove('playing');
      }
    }
  </script>

</body>
</html>
