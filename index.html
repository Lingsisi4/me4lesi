<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>︵‿୨♡୧‿︵</title>
  <style>
    /* 引入圓潤可愛中文字體 (Zen Maru Gothic) 與 Gamja Flower 英文字體 */
    @import url('https://fonts.googleapis.com/css2?family=Gamja+Flower&family=Zen+Maru+Gothic:wght@400;500;700&display=swap');

    * {
      box-sizing: border-box;
    }

    body {
      /* 奶油白底色 + 錯開排列（Staggered）的可愛粉紅波點 */
      background-color: #FFFDF9;
      background-image: 
        radial-gradient(#FCE1E4 1.8px, transparent 1.8px), 
        radial-gradient(#FCE1E4 1.8px, #FFFDF9 1.8px);
      background-size: 24px 24px;
      background-position: 0 0, 12px 12px;
      color: #5C4A4A;
      font-family: 'Zen Maru Gothic', sans-serif;
      margin: 0;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .en-font {
      font-family: 'Gamja Flower', cursive !important;
    }

    /* ===== 主容器：預設手機版（直向單欄） ===== */
    .main-container {
      width: 100%;
      max-width: 380px; /* 手機版最大寬度 */
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      transition: all 0.3s ease;
    }

    /* 左側/上方欄位組合包 */
    .left-column {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      width: 100%;
    }

    /* ===== 第一層：獨立圓形大頭貼 ===== */
    .avatar-section {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .circle-avatar-container {
      width: 90px;
      height: 90px;
      flex-shrink: 0;
    }

    .circle-frame {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 4px solid #FCE1E4;
      background-color: #FFFFFF;
      overflow: hidden;
      box-shadow: 0px 4px 12px rgba(92, 74, 74, 0.08);
    }

    .circle-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* ===== 第二層：Contents 目錄條 ===== */
    .menu-card {
      background: #FFFFFF;
      border: 2px solid #FCE1E4;
      border-radius: 16px;
      padding: 10px 20px;
      box-shadow: 0px 4px 12px rgba(226, 149, 152, 0.12);
      width: fit-content;
      min-width: 150px;
      text-align: center;
    }

    .menu-header {
      font-family: 'Gamja Flower', cursive;
      font-size: 1.5rem;
      color: #E29598;
      font-weight: 700;
      cursor: pointer;
      user-select: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .menu-icon {
      width: 24px;
      height: 24px;
      object-fit: contain;
    }

    .menu-links {
      display: none;
      flex-direction: column;
      gap: 8px;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px dashed #FCE1E4;
    }

    .menu-links.show {
      display: flex;
    }

    .menu-btn {
      text-decoration: none;
      color: #5C4A4A;
      font-family: 'Gamja Flower', cursive;
      font-size: 1.25rem;
      font-weight: 600;
      background: #FFFDF9;
      border: 1px solid #FCE1E4;
      padding: 6px 12px;
      border-radius: 10px;
      text-align: center;
      transition: all 0.2s;
    }

    .menu-btn:hover {
      background: #FCE1E4;
      color: #D87074;
    }

    /* ===== 第三層：歡迎語卡片 ===== */
    .ribbon-card {
      position: relative;
      background: #FFFFFF;
      border: 2px solid #FCE1E4;
      border-radius: 20px;
      padding: 30px 20px 25px 20px;
      width: 100%;
      box-shadow: 0px 6px 18px rgba(226, 149, 152, 0.12);
      box-sizing: border-box;
      text-align: center;
    }

    .card-icon {
      position: absolute;
      top: -22px;
      left: 50%;
      transform: translateX(-50%);
      background-color: transparent;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .card-icon img {
      max-width: 65px;
      max-height: 45px;
      height: auto;
    }

    .notice-text {
      font-size: 0.95rem;
      line-height: 1.8;
      color: #5C4A4A;
      font-weight: 500;
    }

    .notice-highlight {
      color: #D87074;
      font-weight: 700;
    }

    .music-btn {
      position: absolute;
      bottom: -15px;
      left: 15px;
      width: 42px;
      height: 42px;
      background-color: #FFFFFF;
      border: 2px solid #FCE1E4;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      box-shadow: 0px 3px 8px rgba(226, 149, 152, 0.2);
      overflow: hidden;
      padding: 4px;
      transition: transform 0.2s, background-color 0.2s;
      user-select: none;
    }

    .music-btn img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .music-btn:hover {
      transform: scale(1.1);
      background-color: #FFFDF9;
    }

    .music-btn.playing {
      animation: spin 3s linear infinite;
      border-color: #E29598;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    /* ===== 關鍵：平板與電腦版（螢幕寬度超過 680px 時自動變左右兩欄） ===== */
    @media (min-width: 680px) {
      .main-container {
        max-width: 720px;       /* 放大容器總寬度 */
        flex-direction: row;    /* 改為左右橫向排列 */
        align-items: flex-start;/* 頂部對齊 */
        gap: 30px;              /* 左右兩欄間距 */
      }

      .left-column {
        width: 220px;          /* 左欄（大頭貼+目錄）固定寬度 */
        flex-shrink: 0;
      }

      .menu-card {
        width: 100%;           /* 目錄條在左欄中滿寬 */
      }

      .ribbon-card {
        flex: 1;               /* 右欄（歡迎語卡片）自動佔滿剩餘空間 */
      }
    }
  </style>
</head>
<body>

  <div class="main-container">

    <!-- 左欄區塊（手機時在上方，平板/電腦時在左邊） -->
    <div class="left-column">
      <!-- 第一層：大頭貼 -->
      <div class="avatar-section">
        <div class="circle-avatar-container">
          <div class="circle-frame">
            <img class="circle-img" src="IMG_3979.PNG" alt="大頭照">
          </div>
        </div>
      </div>

      <!-- 第二層：Contents 目錄條 -->
      <div class="menu-card">
        <div class="menu-header" onclick="toggleMenu()">
          <img src="IMG_3836.GIF" alt="icon" class="menu-icon">
          <span>Contents</span>
        </div>
        <div class="menu-links" id="menuLinks">
          <a href="about.html" class="menu-btn">About</a>
          <a href="dream.html" class="menu-btn">Dream</a>
          <a href="memo.html" class="menu-btn">Memo</a>
        </div>
      </div>
    </div>

    <!-- 右欄區塊：歡迎語卡片（手機時在下方，平板/電腦時在右邊） -->
    <div class="ribbon-card">
      <div class="card-icon">
        <img src="IMG_4880.GIF" alt="GIF Icon">
      </div>
      
      <div class="notice-text">
        <p class="notice-highlight" style="font-size: 1.1rem; margin-top: 5px; margin-bottom: 4px;">
          戀與製作人 ｜ 凌肖夢向
        </p>
        <p style="margin: 0 0 16px 0; color: #A08888; font-size: 0.9rem;">
          存放有關夢的一切。
        </p>

        <p style="margin: 6px 0;">若無法承接中國乙遊/凌肖夢向皆可直接退設。</p>
        <p style="margin: 6px 0;">不會催稿，但如果有延期需求希望主動告知。</p>
        <p style="margin: 6px 0;">趕時間的話建議可以看 <span class="en-font" style="font-weight: 700; color: #D87074; font-size: 1.1rem;">About</span>。</p>
        <p style="margin: 6px 0; font-size: 0.88rem; color: #A08888;">
          建議使用電腦版網頁或平板開啟。
        </p>
      </div>

      <!-- 左下角音樂播放按鈕 -->
      <div class="music-btn" id="musicBtn" onclick="toggleMusic()" title="播放音樂">
        <img src="1785943711222-removebg-preview.png" alt="Music Icon">
      </div>
      <audio id="bgm" src="bgm.mp3" loop></audio>
    </div>

  </div> <!-- 結束 main-container -->

  <script>
    function toggleMenu() {
      const menuLinks = document.getElementById('menuLinks');
      menuLinks.classList.toggle('show');
    }

    function toggleMusic() {
      const audio = document.getElementById('bgm');
      const btn = document.getElementById('musicBtn');
      
      if (audio.paused) {
        audio.play().then(() => {
          btn.classList.add('playing');
        }).catch(err => {
          alert('請先上傳背景音樂檔（bgm.mp3）或確認網址正確喔！');
        });
      } else {
        audio.pause();
        btn.classList.remove('playing');
      }
    }
  </script>

</body>
</html>
